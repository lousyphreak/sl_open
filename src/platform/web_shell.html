<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>sl_open</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }
    #canvas {
      display: block;
      border: 0;
      outline: none;
      margin: auto;
    }
    #canvas:fullscreen {
      width: 100vw !important;
      height: 100vh !important;
    }
    #status {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 0.5rem;
      color: #fff;
      background: rgb(0 0 0 / 70%);
      text-align: center;
      font: 14px sans-serif;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
  <div id="status" role="status">Downloading...</div>
  <script>
    var canvas = document.getElementById('canvas');
    var statusElement = document.getElementById('status');

    function resizeCanvas() {
      var width;
      var height;
      if (document.fullscreenElement === canvas) {
        var bounds = canvas.getBoundingClientRect();
        width = bounds.width;
        height = bounds.height;
      } else {
        width = window.innerWidth;
        height = window.innerHeight;
        if (window.visualViewport) {
          width = Math.min(width, window.visualViewport.width);
          height = Math.min(height, window.visualViewport.height);
        }
        width = Math.min(width, height * 4 / 3);
        height = width * 3 / 4;
      }
      width = Math.max(1, Math.floor(width));
      height = Math.max(1, Math.floor(height));
      canvas.style.width = width + 'px';
      canvas.style.height = height + 'px';
      if (canvas.width !== width) canvas.width = width;
      if (canvas.height !== height) canvas.height = height;
    }

    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);
    document.addEventListener('fullscreenchange', resizeCanvas);
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', resizeCanvas);
      window.visualViewport.addEventListener('scroll', resizeCanvas);
    }

    var Module = {
      preRun: [],
      canvas: canvas,
      print: function (text) { console.log(text); },
      printErr: function (text) { console.error(text); },
      setStatus: function (text) {
        statusElement.textContent = text;
        statusElement.hidden = !text;
      },
      totalDependencies: 0,
      monitorRunDependencies: function (left) {
        this.totalDependencies = Math.max(this.totalDependencies, left);
        this.setStatus(left
          ? 'Preparing... (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')'
          : 'Starting...');
      }
    };
    canvas.addEventListener('webglcontextlost', function (event) {
      event.preventDefault();
      Module.setStatus('WebGL context lost. Reload the page.');
    });
    window.addEventListener('error', function () {
      Module.setStatus('An error occurred. See the JavaScript console.');
    });
  </script>
  {{{ SCRIPT }}}
</body>
</html>
